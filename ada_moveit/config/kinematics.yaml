# Adapted from: https://github.com/PickNikRobotics/pick_ik/blob/main/doc/USAGE.md
jaco_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.2
  kinematics_solver_attempts: 8
  mode: global
  stop_optimization_on_valid_solution: false
  position_scale: 1.0
  rotation_scale: 0.3
  position_threshold: 0.005
  orientation_threshold: 0.05
  cost_threshold: 0.01
  minimal_displacement_weight: 0.0
  gd_step_size: 0.001
  joint_limit_margin: 0.05
  use_error_states: true
  sample_joint_limits: true
  use_unity_objective: true
